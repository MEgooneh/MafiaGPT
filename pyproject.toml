[project]
name = "mafiagpt"
version = "0.2.0"
description = "A Mafia/Werewolf game moderator powered by OpenRouter."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["openai>=1.40.0"]

[project.scripts]
mafiagpt = "mafiagpt.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
